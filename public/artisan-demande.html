<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Demande</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f8;color:#102634}.top{background:#fff;border-bottom:1px solid #dce7e9;padding:15px 22px}.nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:#087f76}.wrap{max-width:900px;margin:auto;padding:30px 20px}.card{background:#fff;border:1px solid #dce7e9;border-radius:22px;padding:24px;margin-top:18px}.pill{display:inline-block;padding:7px 10px;border-radius:99px;background:#e8faf7;color:#087f76;font-size:10px;font-weight:900}.btn{display:inline-block;text-decoration:none;border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:#39d6c2;color:#05211e}.dark{background:#071827;color:#fff}.muted{color:#6d7f88;font-size:13px}.photo{width:100%;max-height:420px;object-fit:cover;border-radius:16px;margin-top:15px}.status{padding:14px;border-radius:14px;background:#f0f5f5;margin-top:15px;font-size:13px}.success{background:#e8faf7;color:#087f76}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.step{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #edf2f2}.step:last-child{border-bottom:0}.step b{display:block}.step small{color:#6d7f88}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><a class="btn" href="/artisan.html">← Retour</a></div></header><main class="wrap"><div id="content"><div class="card">Chargement de la demande...</div></div></main><script>const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('Erreur '+r.status));return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){if(!id){$('content').innerHTML='<div class="card">Demande introuvable.</div>';return}try{const me=await api('/api/me');const x=await api('/api/requests/'+encodeURIComponent(id));const accepted=x.status==='accepted'&&Number(x.accepted_artisan_id)===Number(me.user.id);let actions='';if(accepted){actions='<div class="status success">✓ Vous avez accepté cette demande. Vous pouvez maintenant contacter le client.</div><div class="actions"><a class="btn primary" href="/messages.html?requestId='+encodeURIComponent(id)+'">💬 Contacter le client</a></div>'}else if(x.status==='accepted'){actions='<div class="status">Cette demande a déjà été acceptée par un autre artisan. Vous ne pouvez plus contacter ce client via cette demande.</div>'}else{actions='<div class="actions"><button id="acceptBtn" class="btn primary" onclick="accept()">✓ Accepter la demande</button></div>'}$('content').innerHTML='<div class="card"><span class="pill">'+(accepted?'✓ Demande acceptée par vous':x.status==='accepted'?'Demande déjà acceptée':'● Demande ouverte')+'</span><h1>'+esc(x.trade||'Demande')+'</h1><p>'+esc(x.description||'Aucune description.')+'</p><p class="muted">Client : '+esc(x.client_name||'')+' · '+esc(x.client_city||x.city||'')+'</p>'+(x.photo_data?'<img class="photo" alt="Photo du problème" src="'+x.photo_data+'">':'')+'<div class="status">🎯 <b>'+Number(x.match_score||x.score||0)+'%</b> de correspondance'+(x.ai_confidence?' · 🤖 IA '+Math.round(Number(x.ai_confidence)*100)+'%':'')+'</div><div class="status"><div class="step"><span>1️⃣</span><div><b>Consultez la demande</b><small>Vous pouvez voir le problème et les informations du client.</small></div></div><div class="step"><span>2️⃣</span><div><b>Acceptez la demande</b><small>Si le chantier vous intéresse, acceptez-la.</small></div></div><div class="step"><span>3️⃣</span><div><b>Contactez le client</b><small>La messagerie devient disponible uniquement après acceptation.</small></div></div></div>'+actions+'</div>'}catch(e){$('content').innerHTML='<div class="card"><h2>Impossible d’ouvrir la demande</h2><p class="muted">'+esc(e.message)+'</p><a class="btn dark" href="/artisan.html">Retour</a></div>'}}async function accept(){const b=$('acceptBtn');if(b){b.disabled=true;b.textContent='Acceptation...'}try{await api('/api/requests/'+encodeURIComponent(id)+'/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await load()}catch(e){if(b){b.disabled=false;b.textContent='✓ Accepter la demande'}alert(e.message)}}load();</script></body></html>
