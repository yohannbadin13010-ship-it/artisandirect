<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Espace artisan</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f8;color:#102634}.top{background:#fff;border-bottom:1px solid #dce7e9;padding:15px 22px;position:sticky;top:0}.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:#087f76}.wrap{max-width:1100px;margin:auto;padding:35px 22px}.hero{background:linear-gradient(145deg,#071827,#164f62);color:#fff;border-radius:25px;padding:30px}.hero p{color:#b9c9cf}.card{background:#fff;border:1px solid #dce7e9;border-radius:21px;padding:23px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;border:1px solid #dce7e9;border-radius:15px}.stat b{display:block;font-size:25px}.muted{color:#6d7f88;font-size:12px}.request{border:1px solid #dce7e9;border-radius:17px;padding:17px;margin-top:12px}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#e8faf7;color:#087f76;font-size:9px;font-weight:900}.btn{display:inline-block;text-decoration:none;border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:#39d6c2;color:#05211e}.dark{background:#071827;color:#fff}.outline{background:#fff;border:1px solid #dce7e9;color:#102634}.empty{text-align:center;padding:28px;color:#6d7f88}@media(max-width:700px){.stats{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><a class="btn outline" href="/">Accueil</a></div></header><main class="wrap"><section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:#39d6c2">ESPACE PROFESSIONNEL</div><h1 id="hello">Bonjour, artisan 👋</h1><p>Les demandes adaptées à votre métier et votre zone apparaissent ici.</p></section><div class="card"><h2>Votre activité</h2><div class="stats"><div class="stat"><span class="muted">Demandes</span><b id="count">—</b></div><div class="stat"><span class="muted">Note</span><b id="rating">—</b></div><div class="stat"><span class="muted">Avis</span><b id="reviews">—</b></div></div></div><div class="card"><h2>Demandes reçues</h2><p class="muted">Cliquez sur <b>Ouvrir la demande</b> pour accéder à une page dédiée.</p><div id="requests"><div class="empty">Chargement...</div></div></div></main><script>const $=id=>document.getElementById(id);async function api(url){const r=await fetch(url);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const me=await api('/api/me');if(me.user.role!=='artisan')return location.href='/';$('hello').textContent='Bonjour, '+me.user.name+' 👋';$('rating').textContent=Number(me.profile?.rating||0).toFixed(1);$('reviews').textContent=me.profile?.review_count||0;const r=await api('/api/requests');$('count').textContent=r.length;$('requests').innerHTML=r.length?r.map(x=>'<article class="request"><span class="pill">'+(x.status==='accepted'?'✓ Acceptée':Number(x.score||0)+'% match')+'</span><h3>'+esc(x.trade||'Demande')+'</h3><p>'+esc(x.description||'Aucune description.')+'</p><div class="muted">'+esc(x.client_name||'Client')+' · '+esc(x.client_city||x.city||'')+'</div><br><a class="btn primary" href="/artisan-demande.html?id='+encodeURIComponent(x.id)+'">Ouvrir la demande →</a></article>').join(''):'<div class="empty">Aucune demande correspondante.</div>'}catch(e){$('requests').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}load();</script></body></html>
