<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Administration</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f8;color:#102634;display:grid;place-items:center;min-height:100vh}.card{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #dce7e9;border-radius:24px;padding:28px;box-shadow:0 15px 45px #09233112}.ey{font-size:10px;font-weight:950;letter-spacing:2px;color:#087f76}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#39d6c2;color:#05211e}.muted{color:#6d7f88;font-size:13px;line-height:1.55}.status{padding:13px;border-radius:12px;background:#f4f8f9;margin:14px 0}.error{background:#fff0f0;color:#a33}.field{margin:12px 0}.field label{display:block;font-size:10px;font-weight:900;color:#71838a;letter-spacing:1px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dce7e9;border-radius:11px;font:inherit}.full{width:100%}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}</style></head><body><main class="card"><div class="ey">ESPACE SÉCURISÉ</div><h1>👑 Administration ARTISANDIRECT</h1><p class="muted">Connexion réservée au compte administrateur.</p><div id="status" class="status">Vérification de votre session…</div><form id="login" style="display:none" onsubmit="login(event)"><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>MOT DE PASSE</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn primary full" type="submit">Se connecter à l'administration</button></form><div id="actions" class="links"></div></main><script>const $=id=>document.getElementById(id);async function api(url,opt={}){const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(url,{...opt,credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store',signal:ctl.signal});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('Erreur serveur HTTP '+r.status));return d}catch(e){if(e.name==='AbortError')throw Error('Le serveur met trop de temps à répondre. Vérifie que Render est bien en statut Live.');throw e}finally{clearTimeout(timer)}}async function verify(){try{await api('/api/me');await api('/api/admin/verifications?limit=1');$('status').textContent='✓ Accès administrateur confirmé.';$('actions').innerHTML='<a class="btn primary" href="/admin-verifications.html">🛡️ Ouvrir les vérifications</a><a class="btn" href="/">← Retour au site</a>'}catch(e){$('login').style.display='block';$('status').textContent='Connectez-vous avec votre compte administrateur.';$('actions').innerHTML='<a class="btn" href="/">← Retour au site</a>'}}async function login(ev){ev.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Connexion…';$('status').className='status';$('status').textContent='Connexion en cours…';try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});$('status').textContent='Connexion réussie. Vérification des droits…';await new Promise(r=>setTimeout(r,150));location.href='/admin/'}catch(e){$('status').className='status error';$('status').textContent=e.message;b.disabled=false;b.textContent="Se connecter à l'administration"}}verify();</script></body></html>
