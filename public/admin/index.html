<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Administration</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f8;color:#102634;display:grid;place-items:center;min-height:100vh}.card{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #dce7e9;border-radius:24px;padding:28px;box-shadow:0 15px 45px #09233112}.ey{font-size:10px;font-weight:950;letter-spacing:2px;color:#087f76}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#39d6c2;color:#05211e}.muted{color:#6d7f88;font-size:13px;line-height:1.55}.status{padding:13px;border-radius:12px;background:#f4f8f9;margin:14px 0}.error{background:#fff0f0;color:#a33}.links{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="card"><div class="ey">ESPACE SÉCURISÉ</div><h1>👑 Administration ARTISANDIRECT</h1><p class="muted">Cet espace est réservé aux comptes administrateurs. L'autorisation est vérifiée par le serveur avant d'afficher les données.</p><div id="status" class="status">Vérification de votre accès…</div><div id="actions" class="links"></div></main><script>async function api(url){const r=await fetch(url,{credentials:'include',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Accès refusé');return d}async function init(){try{const me=await api('/api/me');try{await api('/api/admin/verifications?limit=1');document.getElementById('status').textContent='✓ Accès administrateur confirmé.';document.getElementById('actions').innerHTML='<a class="btn primary" href="/admin-verifications.html">🛡️ Ouvrir les vérifications</a><a class="btn" href="/">← Retour au site</a>'}catch(e){document.getElementById('status').className='status error';document.getElementById('status').textContent='⛔ Ce compte n\'a pas les droits administrateur.';document.getElementById('actions').innerHTML='<a class="btn" href="/">← Retour au site</a>'}}catch(e){document.getElementById('status').className='status error';document.getElementById('status').textContent='⛔ Vous devez être connecté pour accéder à cet espace.';document.getElementById('actions').innerHTML='<a class="btn primary" href="/?login=1">Se connecter</a><a class="btn" href="/">Retour</a>'}}init();</script></body></html>
