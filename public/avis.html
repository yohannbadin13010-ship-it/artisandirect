<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Donner un avis</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f8;color:#102634}.wrap{max-width:650px;margin:auto;padding:35px 20px}.card{background:#fff;border:1px solid #dce7e9;border-radius:22px;padding:25px;box-shadow:0 15px 45px #0923310b}.brand{font-weight:950;margin-bottom:20px}.brand span{color:#087f76}.muted{color:#6d7f88;font-size:13px}.stars{display:flex;gap:7px;margin:20px 0}.star{border:1px solid #dce7e9;background:#fff;border-radius:10px;width:48px;height:44px;font-size:23px;cursor:pointer}.selected{background:#fff5df;border-color:#e0b65c}.textarea{width:100%;min-height:110px;border:1px solid #dce7e9;border-radius:12px;padding:12px;font:inherit;box-sizing:border-box}.btn{margin-top:15px;border:0;border-radius:12px;padding:12px 17px;background:#071827;color:#fff;font-weight:900;cursor:pointer}.status{margin-top:15px;padding:12px;border-radius:12px;background:#f0f5f5}.ok{background:#e8faf7;color:#087f76}</style></head><body><main class="wrap"><div class="brand">AD <span>ARTISANDIRECT</span></div><div class="card" id="app">Chargement...</div></main><script>const app=document.getElementById('app');const id=new URLSearchParams(location.search).get('requestId');let artisanId=null,rating=0;async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{if(!id)throw Error('Demande introuvable');const me=await api('/api/me');const r=await api('/api/requests/'+encodeURIComponent(id));if(me.user.role!=='particulier'||Number(r.user_id)!==Number(me.user.id))throw Error('Accès refusé');if(r.status!=='accepted'||!r.accepted_artisan_id)throw Error('Cette demande n’est pas encore acceptée par un artisan.');artisanId=r.accepted_artisan_id;const existing=await api('/api/reviews/'+id);if(existing.some(x=>Number(x.author_id)===Number(me.user.id))){app.innerHTML='<h2>Avis déjà publié</h2><p class="muted">Vous avez déjà laissé votre avis pour cette demande.</p><button class="btn" onclick="location.href=\'/client.html\'">Retour à mes demandes</button>';return}app.innerHTML='<h1>⭐ Votre avis</h1><p>Votre demande a été acceptée par <strong>'+esc(r.accepted_artisan_name||'votre artisan')+'</strong>.</p><p class="muted">Votre note aidera les prochains clients à choisir leur professionnel.</p><div class="stars">'+[1,2,3,4,5].map(n=>'<button class="star" id="s'+n+'" onclick="pick('+n+')">★</button>').join('')+'</div><textarea id="body" class="textarea" placeholder="Commentaire (facultatif)"></textarea><br><button class="btn" onclick="send()">Publier mon avis</button><div id="status"></div>'}catch(e){app.innerHTML='<h2>Impossible</h2><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="location.href=\'/client.html\'">Retour</button>'}}function pick(n){rating=n;for(let i=1;i<=5;i++)document.getElementById('s'+i).classList.toggle('selected',i<=n)}async function send(){if(!rating)return alert('Choisissez une note de 1 à 5 étoiles.');try{await api('/api/reviews',{method:'POST',body:JSON.stringify({request_id:Number(id),artisan_id:Number(artisanId),rating,body:document.getElementById('body').value.trim()})});app.innerHTML='<h2>Merci ! ⭐</h2><p class="muted">Votre avis a bien été publié et contribue à la note de l’artisan.</p><div class="status ok">Votre retour est maintenant enregistré.</div><button class="btn" onclick="location.href=\'/client.html\'">Retour à mes demandes</button>'}catch(e){alert(e.message)}}load();</script></body></html>
