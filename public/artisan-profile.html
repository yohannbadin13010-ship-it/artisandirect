<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Mon profil professionnel</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f8;color:#102634}.top{background:#fff;border-bottom:1px solid #dce7e9;padding:15px 22px}.nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:#087f76}.wrap{max-width:900px;margin:auto;padding:30px 20px 70px}.card{background:#fff;border:1px solid #dce7e9;border-radius:22px;padding:24px;margin-top:18px}.hero{background:linear-gradient(145deg,#071827,#164f62);color:#fff;border-radius:24px;padding:28px}.hero p{color:#b9c9cf}.avatar{width:76px;height:76px;border-radius:22px;background:#39d6c2;color:#05211e;display:grid;place-items:center;font-size:27px;font-weight:950}.profileHead{display:flex;align-items:center;gap:16px}.label{display:block;font-size:11px;font-weight:900;margin:14px 0 6px}.input,.textarea{width:100%;padding:12px;border:1px solid #dce7e9;border-radius:12px;box-sizing:border-box;font:inherit;background:#fff}.textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:#39d6c2;color:#05211e}.outline{background:#fff;border:1px solid #dce7e9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{border:1px solid #dce7e9;border-radius:15px;padding:14px}.stat b{display:block;font-size:22px}.muted{color:#6d7f88;font-size:12px}.status{margin-top:12px;padding:11px;border-radius:12px;background:#e8faf7;color:#087f76;font-size:12px}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}.profileHead{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><a class="btn outline" href="/artisan.html">← Espace artisan</a></div></header><main class="wrap"><section class="hero"><div class="profileHead"><div class="avatar" id="avatar">A</div><div><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:#39d6c2">PROFIL PROFESSIONNEL</div><h1 id="name">Mon profil</h1><p id="subtitle">Présentez votre activité aux clients.</p></div></div></section><section class="card"><h2>Informations professionnelles</h2><div class="grid"><div><label class="label">Nom / entreprise</label><input class="input" id="nameInput"></div><div><label class="label">Métier</label><input class="input" id="trade"></div><div><label class="label">Ville</label><input class="input" id="city"></div><div><label class="label">Téléphone</label><input class="input" id="phone" type="tel" placeholder="Facultatif"></div><div><label class="label">Zone d'intervention (km)</label><input class="input" id="radius" type="number" min="1" max="200"></div><div><label class="label">Disponibilité</label><select class="input" id="availability"><option value="soon">Disponible bientôt</option><option value="now">Disponible maintenant</option><option value="week">Cette semaine</option><option value="unavailable">Indisponible</option></select></div></div><label class="label">Présentation</label><textarea class="textarea" id="bio" placeholder="Présentez votre expérience, vos spécialités et ce qui vous différencie..."></textarea><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="save()">Enregistrer mon profil</button></div><div id="status"></div></section><section class="card"><h2>Votre réputation</h2><div class="stats"><div class="stat"><span class="muted">Note moyenne</span><b id="rating">—</b></div><div class="stat"><span class="muted">Avis clients</span><b id="reviews">—</b></div><div class="stat"><span class="muted">Profil vérifié</span><b id="verified">—</b></div></div></section></main><script>const $=id=>document.getElementById(id);async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}function initials(s){return String(s||'A').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}async function load(){try{const d=await api('/api/me');if(d.user.role!=='artisan')return location.href='/';const p=d.profile||{};$('name').textContent=d.user.name;$('subtitle').textContent=(p.trade||'Artisan')+' · '+(d.user.city||'Ville non renseignée');$('avatar').textContent=initials(d.user.name);$('nameInput').value=d.user.name||'';$('trade').value=p.trade||'';$('city').value=d.user.city||'';$('phone').value=d.user.phone||'';$('radius').value=p.service_radius_km||15;$('availability').value=p.availability||'soon';$('bio').value=p.bio||'';$('rating').textContent=Number(p.rating||0).toFixed(1)+' ★';$('reviews').textContent=p.review_count||0;$('verified').textContent=p.verified?'✓ Vérifié':'En attente'}catch(e){$('status').innerHTML='<div class="status">'+e.message+'</div>'}}async function save(){try{await api('/api/profile',{method:'PUT',body:JSON.stringify({name:$('nameInput').value.trim(),trade:$('trade').value.trim(),city:$('city').value.trim(),phone:$('phone').value.trim(),radius:Number($('radius').value)||15,availability:$('availability').value,bio:$('bio').value.trim()})});$('status').innerHTML='<div class="status">✓ Profil enregistré avec succès.</div>';load()}catch(e){$('status').innerHTML='<div class="status" style="background:#fff0f0;color:#a33">'+e.message+'</div>'}}load();</script></body></html>
