<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Vérifications</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f8;color:#102634}.top{background:#fff;border-bottom:1px solid #dce7e9;padding:15px 22px}.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:#087f76}.wrap{max-width:1100px;margin:auto;padding:30px 22px}.hero{background:linear-gradient(145deg,#071827,#164f62);color:#fff;border-radius:24px;padding:28px}.hero p{color:#b9c9cf}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat,.card{background:#fff;border:1px solid #dce7e9;border-radius:18px;padding:18px}.stat b{display:block;font-size:26px}.muted{color:#6d7f88;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.outline{background:#fff;border:1px solid #dce7e9}.primary{background:#39d6c2;color:#05211e}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid #dce7e9;border-radius:18px;padding:18px}.head{display:flex;justify-content:space-between;gap:15px}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#f1f4f5;color:#52666e;font-size:10px;font-weight:900}.green{background:#e8faf7;color:#087f76}.orange{background:#fff6df;color:#9b6a0b}.red{background:#fff0f0;color:#a33}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.mini{padding:10px;border:1px solid #dce7e9;border-radius:11px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.error{background:#fff0f0;color:#a33;padding:12px;border-radius:12px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.head{display:block}}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><a class="btn outline" href="/">Accueil</a></div></header><main class="wrap"><section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:#39d6c2">ADMINISTRATION</div><h1>Vérifications artisans</h1><p>Les dossiers en attente de contrôle sont affichés ici.</p></section><section class="stats"><div class="stat"><span class="muted">🟠 À contrôler</span><b id="manual">0</b></div><div class="stat"><span class="muted">⏳ En attente</span><b id="pending">0</b></div><div class="stat"><span class="muted">🟢 Automatiques</span><b id="approved">0</b></div><div class="stat"><span class="muted">🔴 Refusées</span><b id="rejected">0</b></div></section><div class="toolbar"><button class="btn primary" id="refresh">Actualiser</button><button class="btn outline" data-status="manual_review">À contrôler</button><button class="btn outline" data-status="pending">En attente</button><button class="btn outline" data-status="auto_approved">Validées</button><button class="btn outline" data-status="rejected">Refusées</button></div><section id="list" class="list"><div class="card">Chargement des demandes…</div></section></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('Erreur HTTP '+r.status));return d}function statusLabel(s){return {pending:'⏳ En attente',auto_approved:'🟢 Validé automatiquement',manual_review:'🟠 Contrôle nécessaire',rejected:'🔴 Refusé',needs_documents:'📄 Documents nécessaires'}[s]||s}function statusClass(s){return s==='auto_approved'?'green':s==='rejected'?'red':'orange'}async function decide(id,decision){const note=prompt('Note de traitement (facultatif)')||'';try{await api('/api/admin/verifications/'+id+'/decision',{method:'POST',body:JSON.stringify({decision,note})});await load()}catch(e){alert(e.message)}}function render(items){$('list').innerHTML='';if(!items.length){$('list').innerHTML='<div class="card">Aucune demande de vérification dans cette catégorie.</div>';return}items.forEach(x=>{const el=document.createElement('article');el.className='item';const buttons=(x.status==='manual_review'||x.status==='pending'||x.status==='needs_documents')?'<button class="btn primary js-approve">✓ Valider</button><button class="btn outline js-docs">📄 Demander documents</button><button class="btn outline js-reject">✕ Refuser</button>':'';el.innerHTML='<div class="head"><div><strong>'+esc(x.artisan_name)+'</strong><div class="muted">'+esc(x.trade||'Métier non renseigné')+' · '+esc(x.artisan_city||'')+'</div></div><span class="pill '+statusClass(x.status)+'">'+statusLabel(x.status)+'</span></div><div class="grid"><div class="mini">Score automatique<br><strong>'+Number(x.confidence||0)+' %</strong></div><div class="mini">Soumise<br><strong>'+ (x.submitted_at?new Date(x.submitted_at).toLocaleString('fr-FR'):'—') +'</strong></div><div class="mini">Identité<br><strong>'+esc(x.identity_status)+'</strong></div><div class="mini">Entreprise<br><strong>'+esc(x.business_status)+'</strong></div><div class="mini">Qualification<br><strong>'+esc(x.qualification_status)+'</strong></div><div class="mini">Assurance<br><strong>'+esc(x.insurance_status)+'</strong></div></div><div class="actions">'+buttons+'</div>';el.querySelector('.js-approve')?.addEventListener('click',()=>decide(x.id,'approved'));el.querySelector('.js-docs')?.addEventListener('click',()=>decide(x.id,'needs_documents'));el.querySelector('.js-reject')?.addEventListener('click',()=>decide(x.id,'rejected'));$('list').appendChild(el)})}async function load(status=''){try{const d=await api('/api/admin/verifications'+(status?'?status='+encodeURIComponent(status):''));const a=Array.isArray(d.items)?d.items:[];$('manual').textContent=a.filter(x=>x.status==='manual_review').length;$('pending').textContent=a.filter(x=>x.status==='pending').length;$('approved').textContent=a.filter(x=>x.status==='auto_approved').length;$('rejected').textContent=a.filter(x=>x.status==='rejected').length;render(a)}catch(e){$('list').innerHTML='<div class="error">Impossible de charger les demandes : '+esc(e.message)+'</div>'}}$('refresh').addEventListener('click',()=>load());document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>load(b.dataset.status)));load();</script></body></html>
