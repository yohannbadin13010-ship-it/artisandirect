<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Messagerie</title><style>:root{--ink:#071827;--mint:#39d6c2;--bg:#f5f8f8;--line:#dce7e9;--muted:#6d7f88}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#102634}.top{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px}.brand{font-weight:950}.brand span{color:#087f76}.wrap{max-width:850px;margin:auto;padding:30px 22px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 15px 45px #0923310b}.head{background:linear-gradient(145deg,var(--ink),#164f62);color:#fff;border-radius:22px;padding:25px;margin-bottom:16px}.head p{color:#b8c9cf}.messages{min-height:280px;display:flex;flex-direction:column;gap:10px;margin:15px 0}.msg{max-width:75%;padding:11px 14px;border-radius:15px;background:#eef3f4}.msg.mine{align-self:flex-end;background:#dff8f4}.muted{color:var(--muted);font-size:12px}.compose{display:grid;grid-template-columns:1fr auto;gap:10px}.compose textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:900;cursor:pointer}.primary{background:var(--mint);color:#05211e}@media(max-width:600px){.compose{grid-template-columns:1fr}.msg{max-width:90%}}</style></head><body><header class="top"><div class="brand">AD <span>ARTISANDIRECT</span></div></header><main class="wrap"><section class="head"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:var(--mint)">CONTACT DIRECT</div><h1>Votre conversation</h1><p>Échangez avec le professionnel au sujet de votre demande.</p></section><section class="card"><div id="status" class="muted">Chargement…</div><div id="messages" class="messages"></div><div class="compose"><textarea id="body" rows="3" placeholder="Écrivez votre message…"></textarea><button class="btn primary" onclick="send()">Envoyer</button></div></section></main><script>const id=new URLSearchParams(location.search).get('requestId');const $=x=>document.getElementById(x);async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Une erreur est survenue');return d}async function load(){if(!id){$('status').textContent='Aucune demande sélectionnée.';return}try{const m=await api('/api/messages/'+id);$('status').textContent=m.length?m.length+' message(s)':'Aucun message pour le moment.';$('messages').innerHTML=m.map(x=>'<div class="msg '+(x.sender_id?'':'')+'"><strong>'+x.name+'</strong><br>'+x.body+'<div class="muted">'+new Date(x.created_at).toLocaleString('fr-FR')+'</div></div>').join('')}catch(e){$('status').textContent=e.message+'. Connectez-vous d’abord.'}}async function send(){const body=$('body').value.trim();if(!id||!body)return;try{await api('/api/messages',{method:'POST',body:JSON.stringify({request_id:id,body})});$('body').value='';load()}catch(e){$('status').textContent=e.message}}load();setInterval(load,5000)</script></body></html>
