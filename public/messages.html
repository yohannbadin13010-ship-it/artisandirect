<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Messagerie</title><style>:root{--ink:#071827;--mint:#39d6c2;--bg:#f5f8f8;--line:#dce7e9;--muted:#6d7f88}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#102634}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px}.nav{max-width:850px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:#087f76}.wrap{max-width:850px;margin:auto;padding:30px 22px 70px}.head{background:linear-gradient(145deg,var(--ink),#164f62);color:#fff;border-radius:22px;padding:25px;margin-bottom:15px}.head p{color:#b8c9cf}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 15px 45px #0923310b}.messages{min-height:300px;display:flex;flex-direction:column;gap:10px;margin:15px 0}.msg{max-width:75%;padding:11px 14px;border-radius:15px;background:#eef3f4}.msg.mine{align-self:flex-end;background:#dff8f4}.muted{color:var(--muted);font-size:12px;line-height:1.5}.compose{display:grid;grid-template-columns:1fr auto;gap:10px}.compose textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:900;cursor:pointer}.primary{background:var(--mint);color:#05211e}.outline{background:#fff;border:1px solid var(--line)}.banner{padding:12px;border-radius:13px;background:#eef9f7;margin-top:10px}@media(max-width:600px){.compose{grid-template-columns:1fr}.msg{max-width:90%}}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><button class="btn outline" onclick="history.back()">Retour</button></div></header><main class="wrap"><section class="head"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:var(--mint)">CONTACT DIRECT</div><h1 id="title">Votre conversation</h1><p id="subtitle">Échangez directement au sujet de votre demande.</p></section><section class="card"><div id="status" class="muted">Chargement…</div><div id="messages" class="messages"></div><div id="banner" class="banner" style="display:none"></div><div class="compose"><textarea id="body" rows="3" placeholder="Écrivez votre message…"></textarea><button class="btn primary" onclick="send()">Envoyer</button></div></section></main><script>const params=new URLSearchParams(location.search),id=params.get('requestId'),artisanId=params.get('artisanId');const $=x=>document.getElementById(x);async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Une erreur est survenue');return d}async function load(){if(!id){$('status').textContent='Aucune demande sélectionnée.';return}try{const me=await api('/api/me');let who='';if(artisanId){try{const a=await api('/api/artisans/'+artisanId);who=a.name;$('title').textContent='Conversation avec '+a.name;$('subtitle').textContent=a.trade+' · '+a.city+' · ★ '+Number(a.rating).toFixed(1)}catch{}}const m=await api('/api/messages/'+id);$('status').textContent=m.length?m.length+' message(s)':'Premier contact';$('messages').innerHTML=m.map(x=>'<div class="msg '+(Number(x.sender_id)===Number(me.user.id)?'mine':'')+'"><strong>'+esc(x.name)+'</strong><br>'+esc(x.body)+'<div class="muted">'+new Date(x.created_at).toLocaleString('fr-FR')+'</div></div>').join('');if(who&&!m.length){$('banner').style.display='block';$('banner').textContent='Présentez votre besoin clairement. Vous pourrez ensuite convenir ensemble d’un rendez-vous.'}}catch(e){$('status').textContent=e.message+'. Connectez-vous d’abord.'}}async function send(){const body=$('body').value.trim();if(!id||!body)return;try{await api('/api/messages',{method:'POST',body:JSON.stringify({request_id:id,body,artisan_id:artisanId})});$('body').value='';load()}catch(e){$('status').textContent=e.message}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();setInterval(load,5000)</script></body></html>
