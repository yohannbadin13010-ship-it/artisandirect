<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Devis</title><style>:root{--ink:#071827;--mint:#39d6c2;--bg:#f5f8f8;--line:#dce7e9;--muted:#6d7f88;--ok:#118a68;--danger:#a33}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#102634}.top{background:#fff;border-bottom:1px solid var(--line);padding:15px 22px}.nav{max-width:850px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:#087f76}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--mint);color:#05211e}.dark{background:var(--ink);color:#fff}.outline{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f1caca}.wrap{max-width:850px;margin:auto;padding:30px 20px 70px}.hero{background:linear-gradient(145deg,var(--ink),#164f62);color:#fff;border-radius:24px;padding:28px}.hero p{color:#b9c9cf}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:18px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.label{display:block;font-weight:900;font-size:12px;margin:16px 0 7px}input,textarea,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}textarea{min-height:130px;resize:vertical}.amount{font-size:38px;font-weight:950;color:var(--ink)}.status{padding:14px;border-radius:14px;background:#f0f5f5;margin-top:15px}.success{background:#e8faf7;color:#087f76}.warning{background:#fff8e8;color:#8b6200}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions .btn{flex:1;text-align:center}.error{padding:15px;border-radius:14px;background:#fff0f0;color:#9b3333}@media(max-width:600px){.actions .btn{width:100%;flex:auto}}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><button class="btn outline" onclick="history.back()">← Retour</button></div></header><main class="wrap"><section id="page"><div class="card">Chargement...</div></section></main><script>const $=id=>document.getElementById(id);const requestId=new URLSearchParams(location.search).get('requestId');let me=null,request=null;async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur serveur');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function eur(cents){return (Number(cents||0)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}async function load(){if(!requestId){$('page').innerHTML='<div class="card error">Demande introuvable.</div>';return}try{me=await api('/api/me');request=await api('/api/requests/'+encodeURIComponent(requestId));const q=await api('/api/requests/'+encodeURIComponent(requestId)+'/quote');render(q.quote)}catch(e){$('page').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}function render(q){const artisan=me.user.role==='artisan';if(artisan){if(Number(request.accepted_artisan_id)!==Number(me.user.id)){return $('page').innerHTML='<div class="card error">Cette demande ne vous est pas attribuée.</div>'}$('page').innerHTML='<section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:var(--mint)">DEVIS ARTISANDIRECT</div><h1>Proposer un prix au client</h1><p>Le client doit accepter votre devis avant que l’intervention puisse démarrer.</p></section><section class="card"><h2>'+esc(request.trade||'Intervention')+'</h2><p class="muted">Client : '+esc(request.client_name||'')+' · '+esc(request.client_city||request.city||'')+'</p><div class="status">Demande : '+esc(request.description||'Aucune description.')+'</div>'+((q.status==='pending'||q.status==='accepted')?'<div class="status '+(q.status==='accepted'?'success':'warning')+'"><strong>Dernier devis : '+eur(q.amount_cents)+'</strong><br>'+esc(q.description||'')+'<br><span class="muted">Statut : '+(q.status==='accepted'?'accepté par le client':'en attente du client')+'</span></div>':'')+'<form onsubmit="sendQuote(event)"><label class="label">Montant total TTC (€)</label><input id="amount" type="number" min="0.01" max="100000" step="0.01" required placeholder="Ex. 250"><label class="label">Détail de la prestation</label><textarea id="description" required placeholder="Ex. déplacement, main-d’œuvre, pièces prévues, réparation de la fuite..."></textarea><label class="label">Validité du devis</label><select id="expires"><option value="24">24 heures</option><option value="48">48 heures</option><option value="72" selected>72 heures</option><option value="168">7 jours</option></select><div class="actions"><button class="btn primary" type="submit">📄 Envoyer le devis au client</button></div></form><p class="muted" style="margin-top:15px">Le devis est proposé par l’artisan. ARTISANDIRECT facilite l’échange mais ne fixe pas le prix des travaux.</p></section>'}else{const content=q.status==='pending'?'<div class="status warning">📄 Un devis vous attend. Vérifiez le détail et le montant avant de vous engager.</div><div class="amount">'+eur(q.amount_cents)+'</div><div class="status"><strong>Détail du devis</strong><br>'+esc(q.description||'')+'</div><div class="status"><span class="muted">Valable jusqu’au '+(q.expires_at?new Date(q.expires_at).toLocaleString('fr-FR'):'date non précisée')+'</span></div><div class="actions"><button class="btn primary" onclick="quoteAction(\'accept\')">✓ Accepter le devis</button><button class="btn danger" onclick="quoteAction(\'decline\')">✕ Refuser</button></div>':q.status==='accepted'?'<div class="status success">✓ Devis accepté. Le prix convenu est de <strong>'+eur(q.amount_cents)+'</strong>.</div><div class="actions"><a class="btn primary" href="/intervention.html?requestId='+encodeURIComponent(requestId)+'">🛠️ Suivre l’intervention</a></div>':q.status==='declined'?'<div class="status warning">Le dernier devis a été refusé. L’artisan peut en proposer un nouveau.</div>':'<div class="status">L’artisan doit encore vous transmettre son devis.</div>';$('page').innerHTML='<section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:var(--mint)">DEVIS ARTISANDIRECT</div><h1>Votre devis</h1><p>'+esc(request.trade||'Intervention')+' avec '+esc(request.accepted_artisan_name||'votre artisan')+'</p></section><section class="card">'+content+'</section>'}}async function sendQuote(e){e.preventDefault();const amount=Number($('amount').value),description=$('description').value.trim(),expires_hours=Number($('expires').value);try{await api('/api/requests/'+requestId+'/quote',{method:'POST',body:JSON.stringify({amount_eur:amount,description,expires_hours})});await load()}catch(e){alert(e.message)}}async function quoteAction(action){if(action==='accept'&&!confirm('Accepter ce devis et le prix indiqué ?'))return;if(action==='decline'&&!confirm('Refuser ce devis ?'))return;try{await api('/api/requests/'+requestId+'/quote/'+action,{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}}load();</script></body></html>
