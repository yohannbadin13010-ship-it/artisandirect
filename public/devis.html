<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Devis</title><style>:root{--ink:#071827;--mint:#39d6c2;--bg:#f5f8f8;--line:#dce7e9;--muted:#6d7f88;--danger:#a33;--soft:#eef7f6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#102634}.top{background:#fff;border-bottom:1px solid var(--line);padding:15px 22px}.nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:#087f76}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--mint);color:#05211e}.outline{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f1caca}.wrap{max-width:900px;margin:auto;padding:30px 20px 70px}.hero{background:linear-gradient(145deg,var(--ink),#164f62);color:#fff;border-radius:24px;padding:28px}.hero p{color:#b9c9cf}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:18px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.label{display:block;font-weight:900;font-size:12px;margin:15px 0 7px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.status{padding:14px;border-radius:14px;background:#f0f5f5;margin-top:15px}.success{background:#e8faf7;color:#087f76}.warning{background:#fff8e8;color:#8b6200}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions .btn{flex:1;text-align:center}.error{padding:15px;border-radius:14px;background:#fff0f0;color:#9b3333}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.metaBox{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fafcfc}.metaBox strong{display:block;font-size:12px}.line{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;background:#fff}.lineGrid{display:grid;grid-template-columns:2fr .7fr 1fr .8fr auto;gap:8px;align-items:end}.lineTotal{font-weight:900;text-align:right;margin-top:8px}.add{margin-top:12px}.totals{margin-top:18px;padding:18px;border-radius:16px;background:var(--soft)}.totalRow{display:flex;justify-content:space-between;gap:15px;padding:5px 0}.grand{font-size:22px;font-weight:950;border-top:1px solid #cce4e1;margin-top:8px;padding-top:12px}.doc{border:1px solid var(--line);border-radius:16px;padding:18px}.doc h3{margin:0 0 10px}.docLine{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:8px 0;border-bottom:1px solid #edf1f2}.docLine:last-child{border-bottom:0}.docTotals{margin-top:12px;padding-top:12px;border-top:2px solid var(--ink)}@media(max-width:700px){.meta,.lineGrid{grid-template-columns:1fr 1fr}.lineGrid .descWrap{grid-column:1/-1}.lineGrid .remove{grid-column:1/-1}.docLine{grid-template-columns:1fr auto}.docLine span:nth-child(2){text-align:right}.docLine span:nth-child(3){grid-column:1/-1;text-align:right}.actions .btn{width:100%;flex:auto}}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><button class="btn outline" onclick="history.back()">← Retour</button></div></header><main class="wrap"><section id="page"><div class="card">Chargement...</div></section></main><script>const $=id=>document.getElementById(id);const requestId=new URLSearchParams(location.search).get('requestId');let me=null,request=null,profile=null,lines=[];const rates=[20,10,5.5,0];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}function eur(v){return Number(v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur serveur');return d}function rateOptions(selected){return rates.map(r=>'<option value="'+r+'" '+(Number(r)===Number(selected)?'selected':'')+'>'+r+' %</option>').join('')}function readLines(){document.querySelectorAll('.line').forEach((el,i)=>{if(!lines[i])lines[i]={};lines[i].label=el.querySelector('.desc').value.trim();lines[i].qty=Number(el.querySelector('.qty').value)||0;lines[i].unit=Number(el.querySelector('.unit').value)||0;lines[i].rate=Number(el.querySelector('.rate').value)})}function totals(){return lines.reduce((a,l)=>{const t=Math.max(0,Number(l.qty)||0)*Math.max(0,Number(l.unit)||0);const h=Number(l.rate)===0?t:t/(1+Number(l.rate)/100);a.ttc+=t;a.ht+=h;a.tva+=t-h;return a},{ttc:0,ht:0,tva:0})}function canSend(){readLines();const t=totals();return t.ttc>0&&lines.length>0&&!lines.some(l=>!l.label||Number(l.qty)<=0||Number(l.unit)<0)}function renderForm(){readLines();const t=totals();$('lines').innerHTML=lines.map((l,i)=>'<div class="line"><div class="lineGrid"><div class="descWrap"><label class="label">Prestation / produit</label><input class="desc" value="'+esc(l.label)+'" placeholder="Ex. Réparation fuite d’eau"></div><div><label class="label">Qté</label><input class="qty" type="number" min="0.01" step="0.01" value="'+l.qty+'" oninput="refreshTotals()"></div><div><label class="label">Prix TTC / unité</label><input class="unit" type="number" min="0" step="0.01" value="'+l.unit+'" oninput="refreshTotals()"></div><div><label class="label">TVA</label><select class="rate" onchange="refreshTotals()">'+rateOptions(l.rate)+'</select></div><button class="btn danger remove" type="button" onclick="addLineRemove('+i+')">Supprimer</button></div><div class="lineTotal">Sous-total : '+eur((Number(l.qty)||0)*(Number(l.unit)||0))+'</div></div>').join('');$('totalHT').textContent=eur(t.ht);$('totalTVA').textContent=eur(t.tva);$('totalTTC').textContent=eur(t.ttc)}function addLine(){readLines();lines.push({label:'',qty:1,unit:0,rate:20});renderForm()}function addLineRemove(i){readLines();lines.splice(i,1);if(!lines.length)lines.push({label:'',qty:1,unit:0,rate:20});renderForm()}function refreshTotals(){readLines();const t=totals();$('totalHT').textContent=eur(t.ht);$('totalTVA').textContent=eur(t.tva);$('totalTTC').textContent=eur(t.ttc)}function parseQuoteDescription(s){try{const x=JSON.parse(s);return x&&x.version===1?x:null}catch{return null}}function structuredDescription(t){return JSON.stringify({version:1,items:lines.map(l=>({description:l.label,quantity:Number(l.qty),unit_price_ttc:Number(l.unit),vat_rate:Number(l.rate)})),total_ht:Number(t.ht.toFixed(2)),total_vat:Number(t.tva.toFixed(2)),total_ttc:Number(t.ttc.toFixed(2)),artisan:{name:me.user.name||'',email:me.user.email||'',city:me.user.city||'',trade:me.profile?.trade||''},client:{name:request.client_name||'',city:request.client_city||request.city||''},location:request.client_city||request.city||'',validity_hours:Number($('expires').value)})}async function load(){if(!requestId){$('page').innerHTML='<div class="card error">Demande introuvable.</div>';return}try{me=await api('/api/me');request=await api('/api/requests/'+encodeURIComponent(requestId));const q=await api('/api/requests/'+encodeURIComponent(requestId)+'/quote');if(me.user.role!=='artisan'){return renderClient(q.quote)}if(Number(request.accepted_artisan_id)!==Number(me.user.id))return $('page').innerHTML='<div class="card error">Cette demande ne vous est pas attribuée.</div>';profile=me.profile||{};lines=[{label:request.trade?request.trade+' — prestation':'Prestation',qty:1,unit:q.quote?.amount_cents?Number(q.quote.amount_cents)/100:0,rate:20}];const old=parseQuoteDescription(q.quote?.description);if(old?.items?.length)lines=old.items.map(x=>({label:x.description,qty:Number(x.quantity)||1,unit:Number(x.unit_price_ttc)||0,rate:Number(x.vat_rate??20)}));renderArtisan();}catch(e){$('page').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}function renderArtisan(){$('page').innerHTML='<section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:var(--mint)">DEVIS ARTISANDIRECT</div><h1>Un devis simple, complet</h1><p>Vous indiquez uniquement les prestations et produits qui composent votre prix.</p></section><section class="card"><div class="meta"><div class="metaBox"><strong>ARTISAN</strong>'+esc(me.user.name)+'<br>'+esc(profile.trade||'')+' · '+esc(me.user.city||'')+'</div><div class="metaBox"><strong>CLIENT</strong>'+esc(request.client_name||'')+'<br>'+esc(request.client_city||request.city||'')+'</div></div><div class="status"><strong>Demande :</strong> '+esc(request.description||'Aucune description.')+'</div><h2 style="margin-top:24px">Détail du devis</h2><div id="lines"></div><button class="btn outline add" type="button" onclick="addLine()">+ Ajouter une prestation ou un produit</button><div class="totals"><div class="totalRow"><span>Total HT</span><strong id="totalHT">0 €</strong></div><div class="totalRow"><span>TVA</span><strong id="totalTVA">0 €</strong></div><div class="totalRow grand"><span>Total TTC</span><strong id="totalTTC">0 €</strong></div></div><label class="label">Validité du devis</label><select id="expires"><option value="24">24 heures</option><option value="48">48 heures</option><option value="72" selected>72 heures</option><option value="168">7 jours</option></select><div class="actions"><button id="sendBtn" class="btn primary" type="button" onclick="sendQuote()">📄 Envoyer le devis au client</button></div><p id="sendStatus" class="muted"></p><p class="muted">Le devis est proposé par l’artisan. ARTISANDIRECT facilite la mise en relation et le paiement mais ne fixe pas le prix des travaux.</p></section>';renderForm()}function renderClient(q){const x=parseQuoteDescription(q?.description);let content='';if(q?.status==='pending'&&x){content='<div class="status warning">📄 Vérifiez le détail et le montant avant de vous engager.</div><div class="doc"><h3>Détail de la prestation</h3>'+x.items.map(i=>'<div class="docLine"><span>'+esc(i.description)+' × '+esc(i.quantity)+'</span><span>'+eur(Number(i.unit_price_ttc)*Number(i.quantity))+'</span><span>TVA '+esc(i.vat_rate)+' %</span></div>').join('')+'<div class="docTotals"><div class="totalRow"><span>Total HT</span><strong>'+eur(x.total_ht)+'</strong></div><div class="totalRow"><span>TVA</span><strong>'+eur(x.total_vat)+'</strong></div><div class="totalRow grand"><span>Total TTC</span><strong>'+eur(x.total_ttc)+'</strong></div></div></div><div class="status"><span class="muted">Valable jusqu’au '+(q.expires_at?new Date(q.expires_at).toLocaleString('fr-FR'):'date non précisée')+'</span></div><div class="actions"><button class="btn primary" onclick="quoteAction(\'accept\')">✓ Accepter le devis</button><button class="btn danger" onclick="quoteAction(\'decline\')">✕ Refuser</button></div>'}else if(q?.status==='accepted'){content='<div class="status success">✓ Devis accepté. Prix convenu : <strong>'+eur(Number(q.amount_cents||0)/100)+'</strong>.</div><div class="actions"><a class="btn primary" href="/intervention.html?requestId='+encodeURIComponent(requestId)+'">🛠️ Suivre l’intervention</a></div>'}else if(q?.status==='declined'){content='<div class="status warning">Le dernier devis a été refusé. L’artisan peut en proposer un nouveau.</div>'}else content='<div class="status">L’artisan doit encore vous transmettre son devis.</div>';$('page').innerHTML='<section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:var(--mint)">DEVIS ARTISANDIRECT</div><h1>Votre devis</h1><p>'+esc(request.trade||'Intervention')+' avec '+esc(request.accepted_artisan_name||'votre artisan')+'</p></section><section class="card">'+content+'</section>'}async function sendQuote(){const btn=$('sendBtn'),status=$('sendStatus');if(!canSend()){alert('Ajoutez au moins une prestation avec une quantité et un prix.');return}const t=totals();btn.disabled=true;btn.textContent='⏳ Envoi du devis…';if(status)status.textContent='Envoi en cours…';try{await api('/api/requests/'+encodeURIComponent(requestId)+'/quote',{method:'POST',body:JSON.stringify({amount_eur:Number(t.ttc.toFixed(2)),description:structuredDescription(t),expires_hours:Number($('expires').value)})});if(status)status.textContent='✓ Devis envoyé au client.';await load()}catch(e){btn.disabled=false;btn.textContent='📄 Envoyer le devis au client';if(status)status.textContent='';alert(e.message)}}async function quoteAction(action){if(action==='accept'&&!confirm('Accepter ce devis et le prix indiqué ?'))return;if(action==='decline'&&!confirm('Refuser ce devis ?'))return;try{await api('/api/requests/'+encodeURIComponent(requestId)+'/quote/'+action,{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}}load();</script></body></html>
