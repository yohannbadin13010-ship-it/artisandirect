<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Suivi de l’intervention</title><style>:root{--ink:#071827;--mint:#39d6c2;--bg:#f5f8f8;--line:#dce7e9;--muted:#6d7f88;--ok:#118a68}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#102634}.top{background:#fff;border-bottom:1px solid var(--line);padding:15px 22px}.nav{max-width:850px;margin:auto;display:flex;justify-content:space-between}.brand{font-weight:950}.brand span{color:#087f76}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:var(--mint);color:#05211e}.dark{background:var(--ink);color:#fff}.outline{background:#fff;border:1px solid var(--line)}.wrap{max-width:850px;margin:auto;padding:30px 20px 70px}.hero{background:linear-gradient(145deg,var(--ink),#164f62);color:#fff;border-radius:24px;padding:28px}.hero p{color:#b9c9cf}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:23px;margin-top:18px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}.step{padding:13px;border:1px solid var(--line);border-radius:14px;text-align:center}.step.active{background:#e8faf7;border-color:#b9e8df}.step.done{background:#f1faf7;border-color:#ccecdf}.step b{display:block;font-size:22px}.step span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.status{margin-top:17px;padding:14px;border-radius:14px;background:#f4f8f9}.muted{color:var(--muted);font-size:12px;line-height:1.5}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.error{padding:16px;background:#fff0f0;color:#9b3333;border-radius:14px}@media(max-width:650px){.steps{grid-template-columns:1fr 1fr}.actions .btn{width:100%}}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><button class="btn outline" onclick="history.back()">← Retour</button></div></header><main class="wrap"><section id="page"><div class="card">Chargement du suivi...</div></section></main><script>const $=id=>document.getElementById(id);const requestId=new URLSearchParams(location.search).get('requestId');let me=null,workflow=null;async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stepState(name){const order=['accepted','in_progress','completed','confirmed'];const current=order.indexOf(workflow.workflow_status);const idx=order.indexOf(name);return idx<current?'done':idx===current?'active':''}function label(s){return ({accepted:'Demande acceptée',in_progress:'Intervention en cours',completed:'Intervention terminée',confirmed:'Fin confirmée par le particulier'}[s]||s)}async function load(){try{me=await api('/api/me');workflow=await api('/api/requests/'+encodeURIComponent(requestId)+'/workflow');render()}catch(e){$('page').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}function render(){const artisan=me.user.role==='artisan';let action='';if(artisan&&workflow.workflow_status==='accepted')action='<button class="btn primary" onclick="start()">▶️ Démarrer l’intervention</button>';else if(artisan&&workflow.workflow_status==='in_progress')action='<button class="btn primary" onclick="complete()">✅ Déclarer l’intervention terminée</button>';else if(!artisan&&workflow.workflow_status==='completed')action='<button class="btn primary" onclick="confirmEnd()">✅ Confirmer la fin de l’intervention</button>';else if(!artisan&&workflow.workflow_status==='confirmed')action='<a class="btn primary" href="/avis.html?requestId='+encodeURIComponent(requestId)+'">⭐ Donner mon avis</a>';const message=workflow.workflow_status==='accepted'?'L’artisan peut démarrer l’intervention depuis son espace.':workflow.workflow_status==='in_progress'?'L’intervention est actuellement en cours.':workflow.workflow_status==='completed'?'L’artisan a déclaré l’intervention terminée. Il vous reste à confirmer la fin.':'La fin de l’intervention est confirmée. Vous pouvez maintenant laisser votre avis.';$('page').innerHTML='<section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:var(--mint)">SUIVI ARTISANDIRECT</div><h1>'+esc(label(workflow.workflow_status))+'</h1><p>'+message+'</p></section><section class="card"><h2>Votre intervention</h2><div class="steps"><div class="step '+stepState('accepted')+'"><b>1</b><span>Acceptée</span></div><div class="step '+stepState('in_progress')+'"><b>2</b><span>En cours</span></div><div class="step '+stepState('completed')+'"><b>3</b><span>Terminée</span></div><div class="step '+stepState('confirmed')+'"><b>4</b><span>Confirmée</span></div></div><div class="status"><strong>État actuel :</strong> '+esc(label(workflow.workflow_status))+'<br><span class="muted">'+(workflow.started_at?'Démarrée le '+new Date(workflow.started_at).toLocaleString('fr-FR'):'')+(workflow.completed_at?' · Terminée le '+new Date(workflow.completed_at).toLocaleString('fr-FR'):'')+'</span></div><div class="actions">'+action+'<a class="btn outline" href="/messages.html?requestId='+encodeURIComponent(requestId)+'">💬 Ouvrir la messagerie</a></div></section>'}async function start(){await api('/api/requests/'+requestId+'/start',{method:'POST'});await load()}async function complete(){await api('/api/requests/'+requestId+'/complete',{method:'POST'});await load()}async function confirmEnd(){await api('/api/requests/'+requestId+'/confirm',{method:'POST'});await load()}if(!requestId)$('page').innerHTML='<div class="card error">Demande introuvable.</div>';else load();</script></body></html>
