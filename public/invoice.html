<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Facture</title><style>body{margin:0;background:#f5f8f8;color:#102634;font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 20px 70px}.card{background:#fff;border:1px solid #dce7e9;border-radius:22px;padding:28px;margin-top:18px}.hero{background:linear-gradient(145deg,#071827,#164f62);color:#fff;border-radius:24px;padding:28px}.muted{color:#6d7f88;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{border:1px solid #dce7e9;border-radius:15px;padding:15px}.row{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid #edf1f2}.line{display:grid;grid-template-columns:2fr .7fr 1fr .8fr;gap:8px;padding:10px 0;border-bottom:1px solid #edf1f2}.total{font-size:22px;font-weight:950;margin-top:14px}.warning{background:#fff8e8;color:#795900;border-radius:14px;padding:14px;margin-top:15px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;background:#39d6c2;color:#05211e;margin-right:8px}.actions{margin-top:18px}@media print{body{background:#fff}.actions,.warning{display:none}.card,.hero{border:0}.hero{color:#000;background:#fff;padding:0}}@media(max-width:650px){.grid{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:#39d6c2">DOCUMENT DE FACTURATION</div><h1 id="title">Chargement…</h1><p id="sub"></p></section><div id="app"></div></main><script>const id=new URLSearchParams(location.search).get('requestId'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=x=>x?new Date(x).toLocaleString('fr-FR'):'—',eur=c=>(Number(c||0)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});async function load(){try{const r=await fetch('/api/requests/'+encodeURIComponent(id)+'/invoice',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');const x=d.invoice;$('title').textContent=x.invoice_number;$('sub').textContent='Émis le '+date(x.issued_at);const lines=Array.isArray(x.lines)?x.lines:[];$('app').innerHTML='<section class="card"><div class="grid"><div class="box"><strong>PRESTATAIRE</strong><p>'+esc(x.seller_name)+'<br>'+esc(x.seller_address||'Adresse professionnelle à renseigner')+'<br>SIRET/SIREN : '+esc(x.seller_siret||'À renseigner')+(x.seller_vat_number?'<br>TVA : '+esc(x.seller_vat_number):'')+'<br>Forme : '+esc(x.seller_legal_form||'EI')+'</p></div><div class="box"><strong>CLIENT</strong><p>'+esc(x.client_name)+'<br>'+esc(x.client_address||'Adresse à renseigner')+'</p></div></div><h2>Détail de la prestation</h2><div class="line"><strong>Désignation</strong><strong>Qté</strong><strong>PU TTC</strong><strong>Total TTC</strong></div>'+lines.map(l=>'<div class="line"><span>'+esc(l.description)+'</span><span>'+esc(l.quantity)+'</span><span>'+eur(Math.round(Number(l.unit_price_ttc||0)*100))+'</span><strong>'+eur(Math.round(Number(l.unit_price_ttc||0)*Number(l.quantity||1)*100))+'</strong></div>').join('')+'<div style="max-width:360px;margin:20px 0 0 auto"><div class="row"><span>Total HT</span><strong>'+eur(x.total_ht_cents)+'</strong></div><div class="row"><span>TVA</span><strong>'+eur(x.total_vat_cents)+'</strong></div><div class="row total"><span>Total TTC</span><strong>'+eur(x.total_ttc_cents)+'</strong></div><div class="row"><span>Paiement</span><strong>'+esc(x.payment_status)+'</strong></div><div class="row"><span>Payé le</span><strong>'+date(x.payment_date)+'</strong></div></div>'+ (x.status==='draft_incomplete'?'<div class="warning"><strong>⚠ Document incomplet.</strong><br>Les informations légales manquantes doivent être complétées par l’artisan avant utilisation comme facture/note définitive.</div>':'')+'<div class="actions"><button class="btn" onclick="window.print()">🖨️ Imprimer / PDF</button><a class="btn" href="/dossier.html?requestId='+encodeURIComponent(id)+'">📁 Retour au dossier</a></div></section>'}catch(e){$('app').innerHTML='<section class="card"><strong>Impossible de charger le document.</strong><p>'+esc(e.message)+'</p></section>'}}load();</script></body></html>
