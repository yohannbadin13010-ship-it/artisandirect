<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Dossier d’intervention</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f8;color:#102634}.top{background:#fff;border-bottom:1px solid #dce7e9;padding:16px 22px}.nav{max-width:1050px;margin:auto;display:flex;justify-content:space-between}.brand{font-weight:950}.brand span{color:#087f76}.wrap{max-width:1050px;margin:auto;padding:28px 22px 70px}.hero{background:linear-gradient(145deg,#071827,#164f62);color:#fff;border-radius:24px;padding:28px;margin-bottom:16px}.hero p{color:#bfd0d5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #dce7e9;border-radius:20px;padding:20px;margin-bottom:16px}.full{grid-column:1/-1}.muted{color:#6d7f88;font-size:12px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #eef2f3}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#e8faf7;color:#087f76;font-size:10px;font-weight:900}.timeline{margin-top:12px}.event{padding:12px 0 12px 28px;border-left:2px solid #d7e8e6;position:relative}.event:before{content:'';position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:50%;background:#39d6c2}.event b{display:block}.msg{padding:11px 13px;border-radius:14px;background:#eef3f4;margin:8px 0}.quoteLine{display:grid;grid-template-columns:2fr .7fr 1fr 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #eef2f3;font-size:13px}.quoteTotal{font-size:20px;font-weight:950;margin-top:12px}.review{padding:12px 0;border-top:1px solid #dce7e9}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.quoteLine{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><button class="btn" onclick="history.back()">Retour</button></div></header><main class="wrap"><section class="hero"><div style="font-size:10px;font-weight:900;letter-spacing:2px;color:#39d6c2">DOSSIER D’INTERVENTION</div><h1 id="title">Chargement…</h1><p id="subtitle"></p></section><div id="app"></div></main><script>const id=new URLSearchParams(location.search).get('requestId'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=x=>x?new Date(x).toLocaleString('fr-FR'):'—',money=c=>c==null?'—':(Number(c)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}),labels={request_created:'Demande créée',artisan_accepted:'Artisan accepté',quote_created:'Devis proposé',quote_accepted:'Devis accepté',quote_declined:'Devis refusé',payment_started:'Paiement initié',payment_paid:'Paiement confirmé',intervention_started:'Intervention démarrée',intervention_completed:'Intervention terminée',intervention_confirmed:'Intervention confirmée',message_sent:'Message envoyé',review_created:'Avis publié',request_updated:'Dossier mis à jour'};async function api(u){const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}function person(x){if(!x)return '<div class="muted">Pas encore attribué</div>';return '<div class="row"><span>Nom</span><strong>'+esc(x.name)+'</strong></div><div class="row"><span>Métier</span><strong>'+esc(x.trade||'—')+'</strong></div><div class="row"><span>Ville</span><strong>'+esc(x.city||'—')+'</strong></div><div class="row"><span>Téléphone</span><strong>'+esc(x.phone||'—')+'</strong></div><div class="row"><span>Disponibilité</span><strong>'+esc(x.availability||'—')+'</strong></div><div class="row"><span>Vérifié</span><strong>'+((x.verified)?'✓ Oui':'—')+'</strong></div><div class="row"><span>Note</span><strong>'+Number(x.rating||0).toFixed(1)+' ★ ('+Number(x.review_count||0)+' avis)</strong></div>'}function quote(q){let lines=[];if(q.description&&typeof q.description==='object')lines=q.description.lines||[];return '<div class="row"><span>Statut</span><span class="pill">'+esc(q.status)+'</span></div><div class="row"><span>Créé le</span><strong>'+date(q.created_at)+'</strong></div><div class="row"><span>Validité</span><strong>'+date(q.expires_at)+'</strong></div><div class="row"><span>Accepté</span><strong>'+date(q.accepted_at)+'</strong></div>'+(lines.length?'<div style="margin-top:12px"><div class="quoteLine"><strong>Prestation / produit</strong><strong>Qté</strong><strong>PU TTC</strong><strong>Total TTC</strong></div>'+lines.map(l=>'<div class="quoteLine"><span>'+esc(l.name||l.label||'—')+'</span><span>'+esc(l.quantity||1)+'</span><span>'+money(l.unit_price_cents??Math.round(Number(l.unit_price||0)*100))+'</span><span>'+money(l.total_cents??Math.round(Number(l.quantity||1)*Number(l.unit_price||0)*100))+'</span></div>').join('')+'</div>':'')+'<div class="quoteTotal">Total TTC : '+money(q.amount_cents)+'</div>'}async function load(){try{if(!id)throw Error('Aucune demande sélectionnée.');const d=await api('/api/requests/'+encodeURIComponent(id)+'/dossier');$('title').textContent='Dossier #'+d.request.id+' — '+(d.request.trade||'Intervention');$('subtitle').textContent=(d.request.city||'')+' · créé le '+date(d.request.created_at);const msgs=d.messages.map(m=>'<div class="msg"><strong>'+esc(m.name)+'</strong><div>'+esc(m.body)+'</div><div class="muted">'+date(m.created_at)+'</div></div>').join('')||'<div class="muted">Aucun message.</div>';const reviews=d.reviews.map(r=>'<div class="review"><strong>'+('★'.repeat(Number(r.rating)))+('☆'.repeat(5-Number(r.rating)))+' · '+esc(r.author_name)+'</strong><div>'+esc(r.body||'')+'</div><div class="muted">'+date(r.created_at)+'</div></div>').join('')||'<div class="muted">Aucun avis.</div>';const events=d.events.map(e=>'<div class="event"><b>'+esc(labels[e.event_type]||e.event_type)+'</b><span class="muted">'+date(e.created_at)+(e.actor_name?' · '+esc(e.actor_name):'')+'</span></div>').join('')||'<div class="muted">Aucune action enregistrée.</div>';const photo=d.request.photo_data?'<img src="'+esc(d.request.photo_data)+'" alt="Photo de la demande" style="max-width:100%;max-height:360px;border-radius:15px;margin-top:12px">':'';$('app').innerHTML='<div class="grid"><section class="card"><h2>🧰 Demande initiale</h2><div class="row"><span>Métier</span><strong>'+esc(d.request.trade||'—')+'</strong></div><div class="row"><span>Lieu</span><strong>'+esc(d.request.city||'—')+'</strong></div><div class="row"><span>Date</span><strong>'+date(d.request.created_at)+'</strong></div><p>'+esc(d.request.description||'Aucune description.')+'</p>'+photo+'</section><section class="card"><h2>👤 Particulier</h2>'+person(d.client)+'</section><section class="card"><h2>🛠️ Artisan</h2>'+person(d.artisan)+'</section><section class="card"><h2>💶 Devis</h2>'+quote(d.quote)+'</section><section class="card"><h2>💳 Paiement</h2><div class="row"><span>Statut</span><span class="pill">'+esc(d.payment.status)+'</span></div><div class="row"><span>Montant</span><strong>'+money(d.quote.amount_cents)+'</strong></div><div class="row"><span>Payé le</span><strong>'+date(d.payment.paid_at)+'</strong></div><div class="row"><span>Référence</span><strong>'+esc(d.payment.transaction_ref||'Non affichée')+'</strong></div></section><section class="card"><h2>🛠️ Intervention</h2><div class="row"><span>État</span><strong>'+esc(d.request.workflow_status||'—')+'</strong></div><div class="row"><span>Démarrée</span><strong>'+date(d.request.started_at)+'</strong></div><div class="row"><span>Terminée</span><strong>'+date(d.request.completed_at)+'</strong></div><div class="row"><span>Confirmée</span><strong>'+date(d.request.client_confirmed_at)+'</strong></div></section><section class="card full"><h2>💬 Historique des messages</h2>'+msgs+'</section><section class="card full"><h2>⭐ Avis</h2>'+reviews+'</section><section class="card full"><h2>🕘 Chronologie complète</h2><div class="timeline">'+events+'</div></section></div>'}catch(e){$('app').innerHTML='<section class="card"><strong>Impossible de charger le dossier.</strong><p>'+esc(e.message)+'</p></section>'}}load();</script></body></html>
