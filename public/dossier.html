<!doctype html><html><body><h1>ARTISANDIRECT — Dossier d’intervention</h1><p>Chargement du dossier…</p><script>const id=new URLSearchParams(location.search).get('requestId');fetch('/api/requests/'+id+'/dossier').then(r=>r.json()).then(d=>document.body.innerHTML='<h1>Dossier #'+d.request.id+'</h1><pre>'+JSON.stringify(d,null,2)+'</pre>')</script></body></html>
