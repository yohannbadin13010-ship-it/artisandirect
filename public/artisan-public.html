<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTISANDIRECT — Profil professionnel</title><style>:root{--ink:#071827;--mint:#39d6c2;--bg:#f5f8f8;--line:#dce7e9;--muted:#6d7f88;--gold:#b98525}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#102634}.top{background:#fff;border-bottom:1px solid var(--line);padding:15px 22px}.nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:#087f76}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.outline{background:#fff;border:1px solid var(--line);color:#102634}.primary{background:var(--mint);color:#05211e}.wrap{max-width:900px;margin:auto;padding:30px 20px 70px}.hero{background:linear-gradient(145deg,var(--ink),#164f62);color:#fff;border-radius:25px;padding:30px}.head{display:flex;gap:18px;align-items:center}.avatar{width:82px;height:82px;border-radius:23px;background:var(--mint);color:#05211e;display:grid;place-items:center;font-size:27px;font-weight:950}.eyebrow{font-size:10px;font-weight:950;letter-spacing:2px;color:var(--mint)}.hero h1{margin:8px 0}.hero p{color:#b9c9cf}.rating{color:#ffd477;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:23px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info{padding:15px;border:1px solid var(--line);border-radius:15px}.info small{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;margin-bottom:5px}.bio{line-height:1.65}.reviews .review{padding:15px 0;border-bottom:1px solid var(--line)}.reviews .review:last-child{border-bottom:0}.stars{color:var(--gold);letter-spacing:2px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.error{padding:16px;background:#fff0f0;color:#9b3333;border-radius:14px}@media(max-width:650px){.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.actions .btn{width:100%;text-align:center}}</style></head><body><header class="top"><div class="nav"><div class="brand">AD <span>ARTISANDIRECT</span></div><button class="btn outline" onclick="history.back()">← Retour</button></div></header><main class="wrap"><div id="page"><div class="card">Chargement du profil...</div></div></main><script>const $=id=>document.getElementById(id);let artisanId=null;async function api(url){const r=await fetch(url,{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Impossible de charger le profil');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(s){return String(s||'A').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}function availability(v){return ({now:'🟢 Disponible maintenant',week:'🟢 Disponible cette semaine',soon:'🟡 Disponible bientôt',unavailable:'🔴 Indisponible'}[v]||'Disponibilité non renseignée')}async function load(){const id=new URLSearchParams(location.search).get('artisanId');if(!id){$('page').innerHTML='<div class="error">Profil introuvable.</div>';return}artisanId=id;try{const x=await api('/api/artisans/'+encodeURIComponent(id));$('page').innerHTML='<section class="hero"><div class="head"><div class="avatar">'+initials(x.name)+'</div><div><div class="eyebrow">PROFIL PROFESSIONNEL '+(x.verified?'· ✓ VÉRIFIÉ':'')+'</div><h1>'+esc(x.name)+'</h1><p>'+esc(x.trade||'Professionnel')+' · '+esc(x.city||'')+'</p><div class="rating">★ '+Number(x.rating||0).toFixed(1)+' · '+Number(x.review_count||0)+' avis</div></div></div></section><section class="card"><h2>À propos</h2><div class="bio">'+esc(x.bio||'Ce professionnel n’a pas encore renseigné sa présentation.')+'</div><div class="grid" style="margin-top:16px"><div class="info"><small>Zone d’intervention</small><strong>'+esc(x.service_radius_km?x.service_radius_km+' km autour de '+(x.city||''): 'Zone locale')+'</strong></div><div class="info"><small>Disponibilité</small><strong>'+availability(x.availability)+'</strong></div><div class="info"><small>Métier</small><strong>'+esc(x.trade||'Non renseigné')+'</strong></div><div class="info"><small>Réputation</small><strong>★ '+Number(x.rating||0).toFixed(1)+' / 5</strong></div></div><div class="actions"><button class="btn primary" onclick="contact()">💬 Contacter cet artisan</button><button class="btn outline" onclick="history.back()">← Retour aux professionnels</button></div></section><section class="card reviews"><h2>⭐ Avis clients</h2><div id="reviewList">Chargement...</div></section>';loadReviews()}catch(e){$('page').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function loadReviews(){try{const a=await api('/api/public-reviews/'+artisanId);$('reviewList').innerHTML=a.length?a.map(v=>'<div class="review"><div class="stars">'+('★'.repeat(Number(v.rating)))+('☆'.repeat(5-Number(v.rating)))+'</div><strong>'+esc(v.author_name||'Client')+'</strong><div class="muted">'+new Date(v.created_at).toLocaleDateString('fr-FR')+'</div>'+(v.body?'<p>'+esc(v.body)+'</p>':'')+'</div>').join(''):'<div class="muted">Aucun avis client pour le moment.</div>'}catch(e){$('reviewList').innerHTML='<div class="muted">Les avis ne sont pas disponibles.</div>'}}function contact(){const r=new URLSearchParams(location.search).get('requestId');if(r)location.href='/messages.html?requestId='+encodeURIComponent(r)+'&artisanId='+encodeURIComponent(artisanId);else location.href='/';}load();</script></body></html>
